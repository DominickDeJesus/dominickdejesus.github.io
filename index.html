.screen{min-height:100vh;display:flex;flex-direction:column;}

/* HEADER */
.header-bar{
  display:flex;align-items:center;justify-content:space-between;
  padding:20px 40px 16px;
  background:rgba(0,30,80,0.6);
  backdrop-filter:blur(6px);
  border-bottom:3px solid rgba(255,255,255,0.2);
  flex-shrink:0;
}
.results-title{
  font-size:64px;color:#fff;
  text-shadow:4px 4px 0 #000,-2px -2px 0 #222;
  letter-spacing:5px;line-height:1;
}
.btn-row{display:flex;gap:12px;align-items:center;}
.icon-btn{
  background:rgba(0,0,0,0.5);border:2px solid rgba(255,255,255,0.4);
  border-radius:8px;color:#fff;font-family:"Luckiest Guy",cursive;
  font-size:20px;padding:9px 20px;cursor:pointer;transition:all 0.15s;
  letter-spacing:1px;backdrop-filter:blur(4px);
}
.icon-btn:hover{background:rgba(0,0,0,0.7);}
.icon-btn.active{background:rgba(255,200,0,0.3);border-color:rgba(255,220,0,0.8);color:#FFE44D;}
.icon-btn.show-btn{background:rgba(10,100,10,0.6);border-color:rgba(80,220,80,0.9);color:#afffaf;}
.icon-btn.show-btn:hover{background:rgba(10,100,10,0.85);}
.icon-btn.show-btn.pulse{animation:btnpulse 1.2s ease-in-out infinite;}
@keyframes btnpulse{0%,100%{box-shadow:0 0 0 0 rgba(80,220,80,0.7);}50%{box-shadow:0 0 0 14px rgba(80,220,80,0);}}

/* BOARD */
#board-wrap{
  flex:1;
  position:relative;
}

/* ROW */
.player-row{
  position:absolute;
  left:0;right:0;
  height:130px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(
    to right,
    transparent 0%,
    rgba(0,10,50,0.58) 6%,
    rgba(0,10,50,0.58) 94%,
    transparent 100%
  );
  border-top:1px solid rgba(255,255,255,0.14);
  border-bottom:1px solid rgba(255,255,255,0.07);
  overflow:hidden;
  transition: top 0.8s cubic-bezier(0.4, 0, 0.2, 1);
}

.place-label{
  position:absolute;
  top:8px;
  left:calc(50% - 450px + 130px + 8px);
  font-size:18px;
  color:rgba(255,255,230,0.9);
  text-shadow:1px 1px 0 #000, 0 0 8px rgba(0,0,0,0.8);
  letter-spacing:2px;white-space:nowrap;pointer-events:none;line-height:1;
}

.row-inner{
  display:flex;align-items:center;
  width:min(900px,92vw);
}

.place-col{
  width:140px;flex-shrink:0;
  display:flex;align-items:center;justify-content:flex-end;
  padding-right:18px;
}
.place-num{
  font-size:72px;line-height:1;color:#fff;
  text-shadow:4px 4px 0 #000,-1px -1px 0 #333;
  font-style:italic;transition:color 0.4s;
}
.place-num.first {color:#FFD700;}
.place-num.second{color:#E8E8E8;}
.place-num.third {color:#F07020;}

.portrait-wrap{
  flex-shrink:0;width:140px;height:140px;
  border-radius:10px;
  border:3px solid rgba(255,255,255,0.35);
  background:rgba(0,20,70,0.5);
  position:relative;overflow:hidden;
  margin-top:18px;
}
.portrait-wrap img{
  position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%);
  width:130px;height:130px;object-fit:contain;
}

.player-name{
  flex:1;padding:0 28px;
  margin-top:18px;
  font-size:36px;color:#fff;
  text-shadow:2px 2px 0 #000;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  letter-spacing:1px;line-height:1;
}

.coin-display{
  display:flex;align-items:center;gap:12px;
  flex-shrink:0;width:260px;justify-content:flex-end;
  margin-top:18px;
}
.coin-icon{width:58px;height:58px;flex-shrink:0;}
.coin-icon img{width:100%;height:100%;object-fit:contain;}
.coin-count{
  font-size:80px;line-height:1;color:#fff;
  text-shadow:4px 4px 0 #000;
  min-width:100px;text-align:right;transition:color 0.3s;
}

@keyframes coinpop{
  0%{transform:scale(1);}
  35%{transform:scale(1.6);color:#FFE44D;}
  65%{transform:scale(0.88);}
  100%{transform:scale(1);}
}
.coin-pop{animation:coinpop 0.55s ease-out;}

.pending-dot{
  display:none;width:12px;height:12px;border-radius:50%;
  background:#FFE44D;position:absolute;top:8px;right:14px;
  box-shadow:0 0 8px #FFE44D;
}
body.has-pending .pending-dot{display:block;}

/* EDIT OVERLAY */
#edit-overlay{
  display:none;position:fixed;inset:0;z-index:200;
  background:rgba(0,0,20,0.85);
  backdrop-filter:blur(10px);
  overflow-y:auto;padding:50px 40px 60px;
}
#edit-overlay.visible{display:block;}
.ep-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;}
.ep-title{font-size:36px;color:#fff;letter-spacing:3px;text-shadow:2px 2px 0 #000;}
.ep-status{font-size:18px;color:rgba(255,220,60,0.95);letter-spacing:1px;display:none;}
body.has-pending .ep-status{display:block;}
.team-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px;}
.team-card{background:rgba(0,0,50,0.75);border:2px solid rgba(255,255,255,0.15);border-radius:14px;padding:16px 18px;}
.team-card-head{display:flex;align-items:center;gap:12px;margin-bottom:12px;}
.team-card-head img{width:40px;height:40px;object-fit:contain;}
.team-card-name{font-size:20px;color:rgba(255,255,255,0.75);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.team-controls{display:flex;align-items:center;gap:8px;}
.cbtn{
  background:rgba(255,255,255,0.12);border:2px solid rgba(255,255,255,0.25);
  border-radius:7px;color:#fff;font-family:"Luckiest Guy",cursive;
  font-size:24px;width:48px;height:48px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;transition:all 0.1s;
}
.cbtn:hover{background:rgba(255,255,255,0.25);}
.cbtn:active{transform:scale(0.88);}
.cbtn.plus{background:rgba(255,200,0,0.2);border-color:rgba(255,220,0,0.55);}
.cbtn.plus:hover{background:rgba(255,200,0,0.4);}
.coin-input{
  flex:1;background:rgba(0,0,0,0.6);border:2px solid rgba(255,255,255,0.2);
  border-radius:7px;color:#FFE44D;font-family:"Luckiest Guy",cursive;
  font-size:24px;text-align:center;padding:9px 4px;width:0;min-width:0;
  -moz-appearance:textfield;letter-spacing:2px;
}
.coin-input::-webkit-inner-spin-button,.coin-input::-webkit-outer-spin-button{-webkit-appearance:none;}
.coin-input:focus{outline:none;border-color:rgba(255,220,0,0.65);}
.bottom-btns{display:flex;gap:14px;}
.action-btn{
  flex:1;background:rgba(0,0,0,0.5);border:2px solid rgba(255,255,255,0.2);
  border-radius:10px;color:rgba(255,255,255,0.8);font-family:"Luckiest Guy",cursive;
  font-size:20px;padding:16px 8px;cursor:pointer;transition:all 0.15s;letter-spacing:1px;
}
.action-btn:hover{background:rgba(255,255,255,0.12);color:#fff;}
.action-btn.save-btn{background:rgba(10,100,10,0.45);border-color:rgba(80,220,80,0.65);color:#afffaf;}
.action-btn.save-btn:hover{background:rgba(10,100,10,0.7);}
.action-btn.reset-btn:hover{background:rgba(160,20,20,0.45);border-color:rgba(220,80,80,0.65);color:#ffbbbb;}
.action-btn.close-btn{background:rgba(60,60,80,0.5);border-color:rgba(255,255,255,0.3);}
.action-btn.close-btn:hover{background:rgba(80,80,100,0.7);}

body.fullscreen-mode .screen{position:fixed;inset:0;z-index:50;overflow-y:auto;}
</style>
</head>
<body>
<div class="screen">
  <div class="header-bar">
    <div class="results-title">Results</div>
    <div class="btn-row">
      <button class="icon-btn show-btn" id="show-btn" onclick="showResults()" style="display:none">&#9654; Show Results</button>
      <button class="icon-btn" onclick="openEdit()" id="edit-btn">Edit</button>
      <button class="icon-btn" id="fs-btn" onclick="toggleFullscreen()">Full</button>
    </div>
  </div>
  <div id="board-wrap"></div>
</div>

<div id="edit-overlay">
  <div class="ep-header">
    <div class="ep-title">Edit Coins</div>
    <div class="ep-status">&#9679; Changes Ready</div>
  </div>
  <div class="team-grid" id="team-controls"></div>
  <div class="bottom-btns">
    <button class="action-btn save-btn" onclick="savePending()">Save Changes</button>
    <button class="action-btn" onclick="addTeam()">+ Add Team</button>
    <button class="action-btn reset-btn" onclick="resetAll()">Reset All</button>
    <button class="action-btn close-btn" onclick="closeEdit()">Close</button>
  </div>

var PLACES      = ["1st","2nd","3rd","4th","5th","6th","7th","8th"];
var ROW_H       = 138; // updated dynamically — do not change here
var ROW_GAP     = 8;
var KEY         = "mp-yoshi-v12";

var live    = [];
var pending = null;
var draft   = [];

function loadData(){
  try{
    var s=localStorage.getItem(KEY);
    if(s){var d=JSON.parse(s);live=d.live||[];pending=(d.pending!==undefined)?d.pending:null;}
  }catch(e){}
  if(!live.length) live=[
    {name:"Green Yoshi",yi:0,coins:27},
    {name:"Blue Yoshi", yi:1,coins:14},
    {name:"Pink Yoshi", yi:2,coins:12},
    {name:"Red Yoshi",  yi:3,coins:7}
  ];
}

function persist(){
  try{localStorage.setItem(KEY,JSON.stringify({live:live,pending:pending}));}catch(e){}
}

function sorted(arr){
  var out=[];
  for(var i=0;i<arr.length;i++) out.push({name:arr[i].name,yi:arr[i].yi,coins:arr[i].coins,origIdx:i});
  out.sort(function(a,b){return b.coins-a.coins;});
  return out;
}

var TOP_PAD = 80; // ← padding above first row and below last row (px)

function calcTopPad(){ return TOP_PAD; }

function calcRowH(){
  var wrap = document.getElementById("board-wrap");
  var wrapH = wrap.clientHeight;
  var n = live.length || 4;
  var available = wrapH - TOP_PAD * 2 - (n - 1) * ROW_GAP;
  return Math.max(100, Math.floor(available / n));
}

function renderBoard(animateCoins){
  var wrap = document.getElementById("board-wrap");
  var s    = sorted(live);
  ROW_H = calcRowH();
  var topPad = calcTopPad();

  // Update each row height to match new ROW_H
  var allRows = wrap.querySelectorAll(".player-row");
  for(var r=0;r<allRows.length;r++) allRows[r].style.height = ROW_H + "px";

  var existing = {};
  var rows = wrap.querySelectorAll(".player-row");
  for(var i=0;i<rows.length;i++) existing[rows[i].dataset.idx] = rows[i];

  for(var rank=0;rank<s.length;rank++){
    var t      = s[rank];
    var topPx  = topPad + rank * (ROW_H + ROW_GAP);
    var lbl    = rank===0 ? "No change!" : rank<=2 ? "Moving up!" : "";
    var numCls = ["first","second","third"][rank] || "";
    var key    = String(t.origIdx);
    var el     = existing[key];

    if(!el){
      el = document.createElement("div");
      el.className   = "player-row";
      el.dataset.idx = key;
      el.innerHTML   = makeRow(t, rank, lbl, numCls);
      el.style.top   = topPx + "px";
      el.style.transition = "none";
      wrap.appendChild(el);
      (function(e){ requestAnimationFrame(function(){ requestAnimationFrame(function(){ e.style.transition = ""; }); }); })(el);
    } else {
      var lblEl = el.querySelector(".place-label");
      if(lbl){
        if(lblEl){ lblEl.textContent = lbl; }
        else{ var d2=document.createElement("div"); d2.className="place-label"; d2.textContent=lbl; el.appendChild(d2); }
      } else {
        if(lblEl) lblEl.parentNode.removeChild(lblEl);
      }
      el.querySelector(".place-num").textContent = PLACES[rank];
      el.querySelector(".place-num").className   = "place-num " + numCls;
      var cc = el.querySelector(".coin-count");
      var nv = String(t.coins);
      if(animateCoins && cc.textContent !== nv){
        cc.textContent = nv;
        cc.classList.remove("coin-pop");
        void cc.offsetWidth;
        cc.classList.add("coin-pop");
      } else {
        cc.textContent = nv;
      }
      el.style.top = topPx + "px";
    }
    delete existing[key];
  }
  for(var k in existing) existing[k].parentNode.removeChild(existing[k]);
}

function makeRow(t, rank, lbl, numCls){
  return '<div class="pending-dot"></div>'+
    (lbl ? '<div class="place-label">'+lbl+'</div>' : '')+
    '<div class="row-inner">'+
      '<div class="place-col"><div class="place-num '+numCls+'">'+PLACES[rank]+'</div></div>'+
      '<div class="portrait-wrap"><img src="'+YOSHI_IMGS[t.yi%4]+'" alt="'+t.name+'"></div>'+
      '<div class="player-name">'+t.name+'</div>'+
      '<div class="coin-display">'+
        '<div class="coin-icon"><img src="'+COIN_SRC+'" alt="coin"></div>'+
        '<div class="coin-count">'+t.coins+'</div>'+
      '</div>'+
    '</div>';
}

function renderEditPanel(){
  var html = "";
  for(var i=0;i<draft.length;i++){
    var t = draft[i];
    html += '<div class="team-card">'+
      '<div class="team-card-head">'+
        '<img src="'+YOSHI_IMGS[t.yi%4]+'" alt="">'+
        '<div class="team-card-name">'+t.name+'</div>'+
      '</div>'+
      '<div class="team-controls">'+
        '<button class="cbtn" onclick="draftAdj('+i+',-1)">-</button>'+
        '<input class="coin-input" type="number" min="0" max="999" value="'+t.coins+'" id="inp-'+i+'" onchange="draftSet('+i+',this.value)">'+
        '<button class="cbtn plus" onclick="draftAdj('+i+',1)">+</button>'+
      '</div>'+
    '</div>';
  }
  document.getElementById("team-controls").innerHTML = html;
}

function draftAdj(i,d){ draft[i].coins=Math.max(0,draft[i].coins+d); renderEditPanel(); }
function draftSet(i,v){ draft[i].coins=Math.max(0,parseInt(v)||0); }

function openEdit(){
  var src=pending||live; draft=[];
  for(var i=0;i<src.length;i++) draft.push({name:src[i].name,yi:src[i].yi,coins:src[i].coins});
  renderEditPanel();
  document.getElementById("edit-overlay").classList.add("visible");
}
function closeEdit(){ document.getElementById("edit-overlay").classList.remove("visible"); }

function savePending(){
  pending=[];
  for(var i=0;i<draft.length;i++) pending.push({name:draft[i].name,yi:draft[i].yi,coins:draft[i].coins});
  persist(); updatePendingUI();
  var btn=document.querySelector(".save-btn");
  var orig=btn.textContent; btn.textContent="Saved!";
  setTimeout(function(){ btn.textContent=orig; },1400);
}

function showResults(){
  if(!pending) return;
  live=[];
  for(var i=0;i<pending.length;i++) live.push({name:pending[i].name,yi:pending[i].yi,coins:pending[i].coins});
  pending=null; draft=[];
  for(var i=0;i<live.length;i++) draft.push({name:live[i].name,yi:live[i].yi,coins:live[i].coins});
  persist(); renderBoard(true); updatePendingUI(); closeEdit();
}

function updatePendingUI(){
  var hp = pending!==null;
  document.body.classList.toggle("has-pending",hp);
  var sb = document.getElementById("show-btn");
  sb.style.display = hp ? "block" : "none";
  if(hp) sb.classList.add("pulse"); else sb.classList.remove("pulse");
}

function addTeam(){
  if(draft.length>=8) return;
  var i=draft.length;
  draft.push({name:YOSHI_NAMES[i%4],yi:i%4,coins:0});
  live.push({name:YOSHI_NAMES[i%4],yi:i%4,coins:0});
  persist(); renderBoard(false); renderEditPanel();
}

function resetAll(){
  for(var i=0;i<draft.length;i++) draft[i].coins=0;
  pending=null; live=[];
  for(var i=0;i<draft.length;i++) live.push({name:draft[i].name,yi:draft[i].yi,coins:0});
  persist(); renderBoard(false); renderEditPanel(); updatePendingUI();
}

function toggleFullscreen(){
  var fs=document.body.classList.toggle("fullscreen-mode");
  var btn=document.getElementById("fs-btn");
  btn.classList.toggle("active",fs);
  btn.textContent=fs?"Exit":"Full";
}

loadData();
draft=[];
var src2=pending||live;
for(var i=0;i<src2.length;i++) draft.push({name:src2[i].name,yi:src2[i].yi,coins:src2[i].coins});
// Wait for layout then render so calcTopPad gets real height
requestAnimationFrame(function(){
  renderBoard(false);
  updatePendingUI();
});
// Also re-render on resize
window.addEventListener("resize", function(){ renderBoard(false); });
</script>
</body>
</html>
